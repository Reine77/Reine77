# Which exchange to connect to. Any ccxt id works (binance, kucoin, ...).
exchange: binance

# Only spot pairs quoted in this currency are considered for the top_n scan.
quote_currency: USDT

# Scan the top N pairs by 24h quote volume, plus always include extra_symbols.
top_n: 10
extra_symbols:
  - BTC/USDT
  - ETH/USDT

# Candle timeframe used to compute the strategy below.
timeframe: 1h

# Which strategy fires signals, and its parameters. Run the web UI
# (see README) to pick from the available strategies and edit these
# visually, or edit params by hand — any key not listed uses that
# strategy's default. See src/strategies/ for the full parameter list
# of each: ma_crossover, rsi, bollinger_bands, macd, stochastic.
strategy:
  name: ma_crossover
  params:
    fast_period: 9
    slow_period: 21
    ma_type: ema # ema or sma

# Optional: ask an LLM for a second opinion on each signal before you
# confirm it in Telegram. Leave provider blank to disable. Supported:
# openai, anthropic, gemini, grok, mistral. The API key lives in .env
# (LLM_API_KEY), never here.
llm:
  provider: ""
  model: "" # optional override; defaults to a current model for the provider

# How often to re-scan the watchlist.
poll_interval_seconds: 300

# Quote-currency amount to spend per confirmed trade.
order_amount_quote: 50

# When true, confirmed trades are logged but never sent to the exchange.
# Flip to false only once you've validated signals and trust the setup.
dry_run: true

# spot or swap (USDT-margined perpetual futures). In swap mode, a "buy"
# signal opens a long and a "sell" signal opens a short — it does not
# manage or close existing positions, and extra_symbols must use ccxt's
# unified swap format (e.g. "BTC/USDT:USDT", not "BTC/USDT").
market_type: spot

# Only used when market_type is swap.
leverage: 2
margin_mode: isolated # isolated or cross
