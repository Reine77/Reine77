<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylvaine — Phase 4</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <span class="title">Sylvaine</span>
      <span><span class="stat-label">Stage</span><span id="stageValue">1</span></span>
      <span><span class="stat-label">Level</span><span id="levelValue">1</span></span>
      <span class="gold"><span class="stat-label">Gold</span><span id="goldValue">0</span></span>
      <span id="statusLine"></span>
    </header>

    <!-- XP bar, its own row since it needs full width to read well -->
    <div class="panel">
      <div class="hpbar" style="max-width:none;">
        <div class="hpbar-fill" id="xpFill" style="background:var(--gold);"></div>
        <span class="hpbar-text" id="xpText"></span>
      </div>
    </div>

    <!-- The VS arena — hero left / enemy right, split-screen frame.
         Static placeholders for now; Phase 5 swaps these for real
         sprites (idle/attack/hurt/spell states + the sword trail). -->
    <section id="arena">
      <!--
        Both panels below share the EXACT same row order — portrait,
        badge slot, name, hp bar, substats — on purpose. That's what
        keeps the sprite and HP bar "parallel" between hero and
        enemy: with justify-content:flex-end, a flex column anchors
        to its OWN bottom, so two columns with different content
        (e.g. one has a stats line, the other doesn't) end up
        starting at different heights even though they look like
        they should match. Matching row order + row content on both
        sides is what makes the bottom-anchor produce identical
        positions instead of relying on it by luck.
      -->
      <div class="combatant hero">
        <div class="portrait-placeholder">Sylvaine<br>(sprite: Phase 5)</div>
        <!-- Sylvaine never gets a boss badge — this reserves the
             exact same row height as the enemy's badge slot below,
             via visibility (which still takes up space) rather than
             hidden (which collapses to zero height). Without this,
             her panel would shift up/down every time the enemy
             switches between a normal stage and a boss stage. -->
        <span class="boss-badge placeholder">BOSS</span>
        <div class="name">Sylvaine</div>
        <div class="hpbar">
          <div class="hpbar-fill" id="heroHpFill"></div>
          <span class="hpbar-text" id="heroHpText"></span>
        </div>
        <div class="substats">
          dmg <span id="statDamage">-</span> ·
          spd <span id="statSpeed">-</span> ·
          crit <span id="statCrit">-</span><br>
          dps <span id="statDps">-</span> ·
          spell <span id="statSpell">-</span>
        </div>
      </div>

      <div id="vsBadge">VS</div>

      <div class="combatant enemy">
        <div class="portrait-placeholder">Enemy<br>(sprite: Phase 5)</div>
        <span class="boss-badge" id="enemyBoss">BOSS</span>
        <div class="name" id="enemyName">…</div>
        <div class="hpbar">
          <div class="hpbar-fill" id="enemyHpFill"></div>
          <span class="hpbar-text" id="enemyHpText"></span>
        </div>
        <div class="substats" id="enemySubstats"></div>
      </div>
    </section>

    <!-- Reserved layout only — no data or mechanics behind these.
         Companion and Pet are NOT in the current spec; they're
         planned as their own later phases (see README roadmap). -->
    <section id="supportRow">
      <div class="support-slot companion">
        <div class="slot-title">Companion</div>
        Not yet implemented — planned as a future phase.
      </div>
      <div class="support-slot pet">
        <div class="slot-title">Pet</div>
        Not yet implemented.
      </div>
    </section>

    <div class="panel">
      <h2>Hero</h2>
      <div id="gearLine"></div>
    </div>

    <!-- Basic rune-buy list — NOT the real tree UI (that's Phase
         6, with visual prerequisite lines). This is one flat list
         of buttons so runes don't require the console anymore. -->
    <div class="panel">
      <h2>Runes</h2>
      <div id="runeList"></div>
    </div>

    <div class="panel" id="logPanel">
      <h2>Log</h2>
      <div id="logList"></div>
    </div>

  </div>

  <!--
    NOTE ON LOAD ORDER — and why these are not ES modules.

    You asked for no build step and to open this file directly
    from disk. Browsers refuse to load `<script type="module">`
    over the file:// protocol (module fetches are subject to
    CORS, and a local file has no origin), so `import` would
    fail with a CORS error before any code ran.

    Classic scripts have no such restriction. So each file
    attaches itself to one shared global, `window.Sylvaine`, and
    the load order below is the dependency order:

      config  -> plain data, depends on nothing
      rng     -> plain utility
      log     -> plain utility
      stats   -> reads CONFIG
      items   -> reads CONFIG, Stats (Phase 2 — generation + auto-equip)
      runes   -> reads Stats (Phase 3 — rune tree + spell-unlock gate)
      enemies -> reads CONFIG
      game    -> reads CONFIG, Stats, Enemies, (optionally) Items, Runes
      loop    -> calls Game.step
      render  -> reads state, writes DOM (Phase 4) — needs the DOM
                 elements above to already exist, so it loads after
                 #app's markup, same as any other script placement
      main    -> wires it all together, must be last
  -->
  <script src="js/config.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/log.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/items.js"></script>
  <script src="js/runes.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
