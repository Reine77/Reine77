<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylvaine — Phase 1 (logic only)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #14131a;
    color: #cfc9bd;
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: center;
    padding: 2rem;
  }
  h1 { font-size: 1.1rem; letter-spacing: .18em; text-transform: uppercase; }
  code { background: #23202c; padding: .1em .4em; border-radius: 3px; color: #e0d7c4; }
  p { max-width: 42rem; }
  .dim { color: #6f6a7d; }
</style>
</head>
<body>
  <main>
    <h1>Sylvaine &mdash; Phase 1</h1>
    <p>Game logic only. There is deliberately nothing to see here yet.</p>
    <p><strong>Open the browser console</strong> (F12) to watch the fight.<br>
       Type <code>S.help()</code> for the debug commands.</p>
    <p class="dim">Phase 4 adds the real UI. Phase 5 adds the sprites.</p>
  </main>

  <!--
    NOTE ON LOAD ORDER — and why these are not ES modules.

    You asked for no build step and to open this file directly
    from disk. Browsers refuse to load `<script type="module">`
    over the file:// protocol (module fetches are subject to
    CORS, and a local file has no origin), so `import` would
    fail with a CORS error before any code ran.

    Classic scripts have no such restriction. So each file
    attaches itself to one shared global, `window.Sylvaine`, and
    the load order below is the dependency order:

      config  -> plain data, depends on nothing
      rng     -> plain utility
      log     -> plain utility
      stats   -> reads CONFIG
      items   -> reads CONFIG, Stats (Phase 2 — generation + auto-equip)
      runes   -> reads Stats (Phase 3 — rune tree + spell-unlock gate)
      enemies -> reads CONFIG
      game    -> reads CONFIG, Stats, Enemies, (optionally) Items, Runes
      loop    -> calls Game.step
      main    -> wires it all together, must be last
  -->
  <script src="js/config.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/log.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/items.js"></script>
  <script src="js/runes.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
